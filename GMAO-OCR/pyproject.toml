[project]
name = "gmao-ocr"
version = "0.1.0"
description = "GMAO-OCR — lecture de QR codes sur les équipements par photo (vision par ordinateur OCR, FastAPI) + enrichissement via l'API Laravel"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "numpy>=2.1.0",
    "opencv-python>=4.10.0",
    "pillow>=10.0.0",
    "cairosvg>=2.9.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]
optional-dependencies = { pyzbar = ["pyzbar>=0.1.9"] }

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gmao_ocr"
module-root = ""
