[project]
name = "gmao-analytics"
version = "0.1.0"
description = "GMAO Analytics — indicateurs de maintenance MTBF/MTTR/disponibilité et rapports (FastAPI + pandas), enrichis des sorties du modèle prédictif GMAO-ML"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gmao_analytics"
module-root = ""
